<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="utf-8">
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="../../../style.css">
        <link rel="stylesheet" href="style.css">
        <meta name="description" content="Hyper Goner - Asriel Dreemurr">
        <meta name="author" content="Asriel Dreemurr">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>You Idiot.</title>
        <link rel="icon" type="image/png" href="../../../images/faviconheart.png">
    </head>
    <body>
        <article>
            <h1 id="header-text"></h1>
          <div class="image-container">
            <img id="skull" class="pixelated" src="images/HyperGonerStill.png" style="opacity: 0;">
        </div>

        <p id="typewriter-text"></p>

        <audio id="laugh-audio" src="audio/mus_sfx_hypergoner_laugh.ogg"></audio>
        <audio id="type-sound" src="audio/mus_sfx_a_gigatalk.wav"></audio>
        </article>
        <script>
document.addEventListener("DOMContentLoaded", () => {
    const skull = document.getElementById("skull");
    const audio = document.getElementById("laugh-audio");

    document.body.addEventListener("click", () => {

        console.log("* Click.");
        
        // Fade in skull
        skull.style.opacity = "1";

        // Step 1: header appears
        setTimeout(() => {
            showHeader();
        }, 500);

        // Step 2: laugh + effects
        setTimeout(() => {
            skull.src = "images/HyperGonerLaugh.gif"; // make sure filename matches
            audio.play();
            changeFavicon("../../../images/faviconbrokenheart.png");

            startTypewriter(
                "You were foiled by the cunning Asriel Dreemurr,\n evil incarnate.\n" +
                "Beg him for forgiveness,\n and he just may be merciful enough to give you your data back."
            );
        }, 2500);

    }, { once: true });
});

function showHeader() {
    const header = document.getElementById("header-text");
    const sound = document.getElementById("type-sound");

    const text = "YOU IDIOT.";
    let i = 0;

    function type() {
        if (i < text.length) {
            header.textContent += text.charAt(i);

            try {
            const click = sound.cloneNode();
            click.volume = 0.4;
            click.play();
            } catch (e) {}

            i++;
            setTimeout(type, 80);
        }
    }

    type();
}

function changeFavicon(src) {
    let link = document.querySelector("link[rel='icon']");

    if (link) {
        link.remove();
    }

    const newLink = document.createElement("link");
    newLink.rel = "icon";
    newLink.type = "image/png";
    newLink.href = src + "?v=" + Date.now();

    document.head.appendChild(newLink);
}

function startTypewriter(text) {
  const element = document.getElementById("typewriter-text");
  const sound = document.getElementById("type-sound");

  let i = 0;

  function type() {
    if (i < text.length) {
      const char = text.charAt(i);

      if (char === "\n") {
        element.innerHTML += "<br>";
      } else {
        element.innerHTML += char;

        // Play sound every 3 chars only
        if (i % 3 === 0) {
          try {
            const click = sound.cloneNode();
            click.volume = 0.4;
            click.play();
          } catch (e) {}
        }
      }

      i++;
      setTimeout(type, 40);
    }
  }

  type();
}
</script>
    </body>
</html>
